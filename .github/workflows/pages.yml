name: Pages

on:
  push:
    branches: [main]
    paths: ['site/**', 'demos/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the landing site and the skill-built demos
        run: |
          for d in site demos/nordlys demos/portfolio demos/story; do (cd "$d" && npm ci); done
      - name: Build the landing site
        working-directory: site
        run: npm run build && node scripts/check-budgets.mjs --dist dist
      - name: Build the demos into the site
        working-directory: site
        run: node scripts/assemble.mjs
      - name: Test the landing site (Chromium projects)
        working-directory: site
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --project=desktop --project=mobile-low --project=reduced-motion --grep-invert visual
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: site/playwright-report
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
